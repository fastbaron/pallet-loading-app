<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>積み計算テスト</title>
  <style>
    body { font-family: sans-serif; padding:20px; }
    input, button { font-size:18px; padding:8px; margin:6px 0; width:100%; }
    pre { background:#f4f4f4; padding:10px; }
  </style>
</head>
<body>

<h2>計算テスト</h2>

<label>たまご 個数</label>
<input id="egg" type="number" value="57">

<label>Boss 個数</label>
<input id="boss" type="number" value="25">

<button onclick="calc()">計算する</button>

<pre id="out">ここに結果が出ます</pre>

<script>
function calc() {
  const egg = Number(document.getElementById("egg").value);
  const boss = Number(document.getElementById("boss").value);

  const eggDan = Math.floor(egg / 8);
  const eggAmari = egg % 8;

  const bossDan = Math.floor(boss / 7);
  const bossAmari = boss % 7;

  document.getElementById("out").textContent =
    `たまご ${egg}個 ${eggDan}・・・${eggAmari}\n` +
    `Boss ${boss}個 ${bossDan}・・・${bossAmari}`;
}
</script>

</body>
</html>
